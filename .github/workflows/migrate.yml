name: migrate

# Migrations run on merge, never at app boot: serverless instances start
# concurrently and would race each other applying the same migration.
#
# Content (npm run db:seed) is deliberately not applied here: the database is
# the source of truth for tasks, and an automatic re-import would overwrite
# edits made in the authoring UI. Seeding stays a manual step.

on:
  push:
    branches: [main]
    paths:
      - 'drizzle/**'
      - 'lib/db/schema.ts'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # DATABASE_URL lives on this environment, not in repo-wide secrets, so it
    # cannot be read by a workflow running on a branch or a fork. It must be
    # Neon's *unpooled* string: DDL through the transaction pooler misbehaves.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
