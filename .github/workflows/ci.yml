name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast signal: types, lint, pure unit tests. `next build` is deliberately
  # absent here — Vercel builds every PR and reports its own status check, so
  # building twice doubles the wait for no extra signal. The runner job below
  # does build, because its tests need a served app.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run --passWithNoTests
      # The migration-drift check returns here with the Drizzle schema. Adding it
      # now would fail on a repository that has no drizzle/ directory yet.

  # Slow job, separated so it can be re-run alone after a runner change.
  # Every curriculum construct that actually executes Python lives here:
  # variables, arithmetic, if, while, for, input, turtle, random, try/except.
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:runner
        env:
          CI: 'true'
