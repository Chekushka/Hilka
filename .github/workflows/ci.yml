name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast signal: types, lint, pure unit tests. `next build` is deliberately
  # absent here — Vercel builds every PR and reports its own status check, so
  # building twice doubles the wait for no extra signal. The runner job below
  # does build, because its tests need a served app.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run --passWithNoTests
      # The file-delivery allow-list (lib/task/file-lint.ts) is only as good as
      # the runs behind it: every entry must still behave identically on Skulpt
      # and real CPython. Re-proves it on every change, a Skulpt bump included.
      - run: npm run confirm:safe-subset
      # A schema edit committed without its migration is invisible until a
      # deploy tries to run against the old tables. Generating again must
      # produce nothing: anything new means the migration is missing.
      - name: migration drift
        run: |
          npm run db:generate -- --name ci_drift_check < /dev/null
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "::error::lib/db/schema.ts changed without a migration — run 'npm run db:generate' and commit drizzle/"
            exit 1
          fi

  # Slow job, separated so it can be re-run alone after a runner change.
  # Everything that needs a real browser: every curriculum construct that
  # executes Python, and the student workspace end to end.
  browser:
    runs-on: ubuntu-latest
    # The workspace reads its task from the database, so the end-to-end tests
    # need one. A throwaway Postgres is enough: nothing here is Neon-specific.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # Only signs a same-run cookie for the browser tests; not a secret
      # worth protecting, unlike the real value Vercel needs (docs/CI_CD.md).
      AUTH_SECRET: ci-throwaway-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CI: 'true'
