name: tmp-list-neon-branches

# Temporary, throwaway: lists this Neon project's branch names (read-only —
# no delete, no create) so the real branch-naming pattern used by
# neon-branch-cleanup.yml can be confirmed instead of guessed. Delete this
# file once that is done.

on:
  push:
    branches:
      - claude/jolly-goodall-e82ip4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-branches:
    runs-on: ubuntu-latest
    steps:
      - name: List Neon branches (names only)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          status=$(curl -sS -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches")
          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "--- response body ---"
            cat response.json
            exit 1
          fi
          echo "--- branch names ---"
          jq -r '.branches[] | "\(.name)  (id=\(.id), default=\(.default))"' response.json
