name: spike

# Publishes the static spike page (docs/SPIKE.md) to GitHub Pages so the six
# checks can be run on the weakest machine in the classroom, on the school
# network, from a URL. Two of the six checks are about that machine, not about
# Skulpt, and they cannot be measured on a dev laptop.

on:
  push:
    branches: [main]
    paths: ['spike/**', '.github/workflows/spike-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: spike
      - id: deploy
        uses: actions/deploy-pages@v4
